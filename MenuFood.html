<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីកម្មង់អាហារ & Telegram</title>
    <style>
        body {
            font-family: 'Khmer OS Battambang', Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            margin: 0;
            color: #333;
        }
        .app-container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #ff6b6b;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #ddd;
        }
        .item-img {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .item-details {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .item-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .item-price { color: #ff6b6b; font-weight: bold; font-size: 15px; margin-bottom: 8px;}
        .btn-add {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            align-self: flex-start;
        }
        .btn-add:hover { background-color: #45a049; }
        .cart-section {
            margin-top: 30px;
            background-color: #fff9f9;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ffebeb;
        }
        .cart-section h3 { margin-top: 0; color: #ff6b6b; }
        #cart-list { list-style: none; padding: 0; margin: 0 0 15px 0; }
        #cart-list li {
            display: flex; justify-content: space-between; padding: 5px 0;
            border-bottom: 1px dotted #ccc; font-size: 14px;
        }
        .total-price { text-align: right; font-size: 18px; font-weight: bold; color: #333; }
        input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
            font-family: inherit;
        }
        .btn-submit {
            width: 100%; background-color: #ff6b6b; color: white; border: none;
            padding: 12px; font-size: 16px; font-weight: bold;
            border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background-color: #ff4757; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>🍲 ម៉ឺនុយប្រចាំថ្ងៃ</h2>
        
        <div id="show-menu"></div>

        <div class="cart-section">
            <h3>🛒 កន្ត្រករបស់អ្នក</h3>
            <ul id="cart-list">
                <li style="color: #888; border: none;">មិនទាន់មានមុខម្ហូបនៅឡើយទេ</li>
            </ul>
            <div class="total-price">សរុប: $<span id="total">0.00</span></div>
            
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
            
            <input type="text" id="cust-name" placeholder="ឈ្មោះរបស់អ្នក" required>
            <input type="text" id="cust-contact" placeholder="លេខទូរស័ព្ទ ឬ Telegram (@username)" required>
            
            <button id="submit-btn" class="btn-submit" onclick="submitOrder()">🚀 បញ្ជូនការកម្មង់ & ទីតាំង</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ១. ដាក់ពត៌មាន TELEGRAM របស់អ្នកនៅទីនេះ
        // ==========================================
        const BOT_TOKEN = "ដាក់_TOKEN_BOT_របស់អ្នកនៅទីនេះ"; 
        const CHAT_ID = "ដាក់_CHAT_ID_របស់អ្នកនៅទីនេះ"; 
        // ឧទាហរណ៍ BOT_TOKEN: "123456789:ABCdefGHIjklmNOPQ..."
        // ឧទាហរណ៍ CHAT_ID: "123456789"

        let foods = [
            { name: "បាយឆាសាច់ជ្រូក", price: 2.50, image: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=200&fit=crop" },
            { name: "គុយទាវសាច់គោ", price: 3.00, image: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=200&fit=crop" },
            { name: "បាយស្រូបសាច់ជ្រូក", price: 1.50, image: "https://images.unsplash.com/photo-1627308595229-7830f5c9c66e?w=200&fit=crop" },
            { name: "កាហ្វេទឹកដោះគោ", price: 1.25, image: "https://images.unsplash.com/photo-1461023058943-0708e5223aeb?w=200&fit=crop" }
        ];

        let cart = [];
        let totalPrice = 0;

        function displayMenu() {
            let menuContainer = document.getElementById("show-menu");
            let htmlContent = "";
            for (let i = 0; i < foods.length; i++) {
                htmlContent += `
                    <div class="item">
                        <img src="${foods[i].image}" alt="${foods[i].name}" class="item-img">
                        <div class="item-details">
                            <span class="item-name">${foods[i].name}</span>
                            <span class="item-price">$${foods[i].price.toFixed(2)}</span>
                            <button class="btn-add" onclick="addToCart('${foods[i].name}', ${foods[i].price})">➕ កម៉្មង់</button>
                        </div>
                    </div>
                `;
            }
            menuContainer.innerHTML = htmlContent;
        }

        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            totalPrice += price;
            updateCartUI();
        }

        function updateCartUI() {
            let cartList = document.getElementById("cart-list");
            cartList.innerHTML = "";
            for (let i = 0; i < cart.length; i++) {
                cartList.innerHTML += `<li><span>${cart[i].name}</span><span>$${cart[i].price.toFixed(2)}</span></li>`;
            }
            document.getElementById("total").innerText = totalPrice.toFixed(2);
        }

        // ==========================================
        // មុខងារបញ្ជូនការកម្មង់ និងចាប់ទីតាំង GPS
        // ==========================================
        function submitOrder() {
            let name = document.getElementById("cust-name").value;
            let contact = document.getElementById("cust-contact").value;
            let btn = document.getElementById("submit-btn");

            if (cart.length === 0) { alert("⚠️ សូមរើសមុខម្ហូបយ៉ាងហោចណាស់ ១ សិន!"); return; }
            if (name === "" || contact === "") { alert("⚠️ សូមបំពេញឈ្មោះ និងលេខទូរស័ព្ទ/Telegram របស់អ្នក!"); return; }

            // ដូរស្ថានភាពប៊ូតុងពេលកំពុងដំណើរការ
            btn.innerText = "⏳ កំពុងចាប់ទីតាំង និងបញ្ជូន...";
            btn.disabled = true;

            // ចាប់ទីតាំង GPS
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        sendToTelegramAPI(name, contact, lat, lon, btn);
                    },
                    (error) => {
                        alert("⚠️ សូមចុច Allow Location (អនុញ្ញាតទីតាំង) នៅក្នុង Browser ទើបអាចបញ្ជូនការកម្មង់បាន!");
                        btn.innerText = "🚀 បញ្ជូនការកម្មង់ & ទីតាំង";
                        btn.disabled = false;
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("⚠️ ទូរស័ព្ទរបស់អ្នកមិនគាំទ្រប្រព័ន្ធទីតាំង GPS ទេ!");
                btn.innerText = "🚀 បញ្ជូនការកម្មង់ & ទីតាំង";
                btn.disabled = false;
            }
        }

        // ==========================================
        // មុខងារបាញ់ទិន្នន័យទៅកាន់ Telegram
        // ==========================================
        async function sendToTelegramAPI(name, contact, lat, lon, btn) {
            let orderDetails = cart.map(item => `- ${item.name} ($${item.price.toFixed(2)})`).join('\n');
            
            // រៀបចំអត្ថបទសារដែលត្រូវលោតចូល Telegram
            let message = `🛒 <b>មានការកម្មង់ថ្មីចូល!</b>\n\n`;
            message += `👤 <b>ឈ្មោះអតិថិជន:</b> ${name}\n`;
            message += `📞 <b>លេខទាក់ទង / Telegram:</b> ${contact}\n\n`;
            message += `📋 <b>មុខម្ហូបដែលកម៉្មង់:</b>\n${orderDetails}\n\n`;
            message += `💰 <b>សរុបទឹកប្រាក់: $${totalPrice.toFixed(2)}</b>\n\n`;
            message += `📍 <b>ទីតាំងអតិថិជន (មើលផែនទីខាងក្រោម) 👇</b>`;

            const urlText = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const urlLocation = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;

            try {
                // ១. ផ្ញើវិក្កយបត្រ (Text)
                await fetch(urlText, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
                });

                // ២. ផ្ញើទីតាំងផែនទី (Map Location)
                await fetch(urlLocation, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
                });

                alert("✅ ការកម្មង់ទទួលបានជោគជ័យ! យើងខ្ញុំនឹងទាក់ទងទៅអ្នកឆាប់ៗ។");
                
                // លុបទិន្នន័យកន្ត្រកចោលវិញបន្ទាប់ពីកម្មង់រួច
                cart = [];
                totalPrice = 0;
                updateCartUI();
                document.getElementById("cart-list").innerHTML = '<li style="color: #888; border: none;">មិនទាន់មានមុខម្ហូបនៅឡើយទេ</li>';
                document.getElementById("cust-name").value = "";
                document.getElementById("cust-contact").value = "";

            } catch (error) {
                alert("❌ មានបញ្ហាក្នុងការផ្ញើ សូមពិនិត្យមើលអ៊ិនធឺណិត ឬសាកល្បងម្ដងទៀត!");
            } finally {
                btn.innerText = "🚀 បញ្ជូនការកម្មង់ & ទីតាំង";
                btn.disabled = false;
            }
        }

        displayMenu();
    </script>

</body>
</html>
