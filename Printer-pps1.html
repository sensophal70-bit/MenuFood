<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Web Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 flex flex-col items-center">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm mt-10">
        <h1 class="text-xl font-bold mb-2 text-center">Nyear Thermal Printer</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Bluetooth: PPS1_21ED</p>
        
        <button id="printBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg active:bg-blue-800 transition shadow-lg">
            ភ្ជាប់ & ព្រីនវិក្កយបត្រ
        </button>
        
        <div id="status" class="mt-6 text-sm text-center text-gray-700 font-medium whitespace-pre-wrap"></div>
    </div>

    <script>
        document.getElementById('printBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            
            try {
                // ១. ចាប់ផ្តើមស្វែងរកម៉ាស៊ីន
                statusText.innerText = "កំពុងស្វែងរកម៉ាស៊ីនព្រីន...";
                
                const device = await navigator.bluetooth.requestDevice({
                    // ប្រើ acceptAllDevices ឲ្យលោតផ្ទាំងរើសឈ្មោះ Bluetooth ទាំងអស់
                    acceptAllDevices: true,
                    // កំណត់ UUIDs ដែលម៉ាស៊ីនព្រីនទូទៅប្រើប្រាស់
                    optionalServices: [
                        '000018f0-0000-1000-8000-00805f9b34fb', // Nyear default UUID
                        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
                        '49535343-fe7d-4ae5-8fa9-9fafd205e455'
                    ]
                });

                // ២. ធ្វើការតភ្ជាប់
                statusText.innerText = `កំពុងភ្ជាប់ទៅកាន់ ${device.name || 'ម៉ាស៊ីនព្រីន'}...`;
                const server = await device.gatt.connect();
                
                // ៣. ទាញយក Service និង Characteristic សម្រាប់បញ្ជូនទិន្នន័យ
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

                statusText.innerText = "កំពុងបញ្ជូនទិន្នន័យ (ESC/POS)...";

                // ៤. ទិន្នន័យវិក្កយបត្រដែលត្រូវព្រីន (\n សម្រាប់ចុះបន្ទាត់)
                const receiptText = 
                    "RECEIPT\n" +
                    "--------------------------\n" +
                    "Item 1              $5.00\n" +
                    "Item 2             $10.00\n" +
                    "--------------------------\n" +
                    "Total              $15.00\n" +
                    "Thank You!\n\n\n";

                // បំប្លែងអក្សរទៅជា Bytes
                const encoder = new TextEncoder();
                const data = encoder.encode(receiptText);
                
                // បញ្ជូនទិន្នន័យទៅកាន់ម៉ាស៊ីនព្រីន
                await characteristic.writeValue(data);
                
                // ៥. ជោគជ័យ និងផ្តាច់ Bluetooth វិញ
                statusText.innerHTML = `<span class="text-green-600">ព្រីនបានជោគជ័យ!</span>`;
                device.gatt.disconnect();
                
            } catch (error) {
                // បង្ហាញ Error ដោយផ្ទាល់ មិនប្រើ error.message ដើម្បីការពារ undefined
                statusText.innerHTML = `<span class="text-red-500">បញ្ហា: ${error}</span>`;
                console.error("Bluetooth Error:", error);
            }
        });
    </script>
</body>
</html>
