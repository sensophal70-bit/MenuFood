<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ប្រព័ន្ធគ្រប់គ្រងភោជនីយដ្ឋាន (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .modal { opacity: 0; pointer-events: none; transition: all 0.3s ease; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: all 0.3s ease; }
        .modal.active .modal-content { transform: scale(1); }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .nav-item.active { background-color: #fff7ed; color: #ea580c; border-right: 4px solid #ea580c; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* Safe area for iOS bottom bar */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- របារចំហៀង (Sidebar Desktop) -->
    <aside class="w-64 bg-white shadow-lg z-20 flex-shrink-0 flex flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-100 flex items-center gap-3 text-orange-600">
            <i class="fas fa-store text-3xl"></i>
            <span class="text-xl font-bold tracking-tight">អ្នកគ្រប់គ្រង</span>
        </div>
        <nav class="flex-1 py-4">
            <button onclick="window.switchTab('orders')" id="nav-orders" class="nav-item active w-full flex items-center gap-3 px-6 py-4 text-left font-medium text-gray-600 hover:bg-gray-50 transition">
                <i class="fas fa-concierge-bell w-5"></i> ការកុម្ម៉ង់អតិថិជន
                <span id="newOrderBadge" class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full hidden">ថ្មី</span>
            </button>
            <button onclick="window.switchTab('categories')" id="nav-categories" class="nav-item w-full flex items-center gap-3 px-6 py-4 text-left font-medium text-gray-600 hover:bg-gray-50 transition">
                <i class="fas fa-tags w-5"></i> ប្រភេទម្ហូប
            </button>
            <button onclick="window.switchTab('foods')" id="nav-foods" class="nav-item w-full flex items-center gap-3 px-6 py-4 text-left font-medium text-gray-600 hover:bg-gray-50 transition">
                <i class="fas fa-hamburger w-5"></i> បញ្ជីមុខម្ហូប
            </button>
        </nav>
    </aside>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-5px_15px_rgba(0,0,0,0.05)] border-t border-gray-200 flex justify-around items-center z-40 pb-safe">
        <button onclick="window.switchTab('orders')" id="nav-mobile-orders" class="flex-1 flex flex-col items-center py-3 text-orange-600 transition">
            <div class="relative">
                <i class="fas fa-concierge-bell text-xl mb-1"></i>
                <span id="mobileOrderBadge" class="absolute -top-1 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </div>
            <span class="text-[11px] font-medium mt-1">កុម្ម៉ង់</span>
        </button>
        <button onclick="window.switchTab('categories')" id="nav-mobile-categories" class="flex-1 flex flex-col items-center py-3 text-gray-400 transition">
            <i class="fas fa-tags text-xl mb-1"></i>
            <span class="text-[11px] font-medium mt-1">ប្រភេទ</span>
        </button>
        <button onclick="window.switchTab('foods')" id="nav-mobile-foods" class="flex-1 flex flex-col items-center py-3 text-gray-400 transition">
            <i class="fas fa-hamburger text-xl mb-1"></i>
            <span class="text-[11px] font-medium mt-1">មុខម្ហូប</span>
        </button>
    </nav>

    <!-- ផ្នែកមាតិកា (Main Content) -->
    <main class="flex-1 flex flex-col overflow-hidden w-full relative">
        <!-- Top header Mobile -->
        <div class="md:hidden bg-white px-4 py-3 shadow-sm border-b border-gray-100 flex items-center gap-2 text-orange-600 font-bold text-lg sticky top-0 z-30">
            <i class="fas fa-store"></i> Admin Dashboard
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24 md:pb-8">
            
            <!-- Tab: ការកុម្ម៉ង់ (Orders) -->
            <div id="tab-orders" class="block animate-fade-in">
                <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-clipboard-list text-orange-500"></i> បញ្ជីការកុម្ម៉ង់
                </h1>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                    <div id="ordersList" class="divide-y divide-gray-100">
                        <div class="p-8 text-center text-gray-500">កំពុងផ្ទុក...</div>
                    </div>
                </div>
            </div>

            <!-- Tab: ប្រភេទម្ហូប (Categories) -->
            <div id="tab-categories" class="hidden">
                <div class="flex flex-row justify-between items-center mb-6 gap-2">
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="fas fa-tags text-orange-500"></i> ប្រភេទ
                    </h1>
                    <button onclick="window.openCategoryModal()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg shadow-sm font-medium flex items-center gap-2 transition active:scale-95 text-sm md:text-base">
                        <i class="fas fa-plus"></i> <span class="hidden sm:inline">បន្ថែមប្រភេទ</span><span class="sm:hidden">បន្ថែម</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="categoriesGrid">
                    <!-- Categories will render here -->
                </div>
            </div>

            <!-- Tab: មុខម្ហូប (Foods) -->
            <div id="tab-foods" class="hidden">
                <div class="flex flex-row justify-between items-center mb-6 gap-2">
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="fas fa-hamburger text-orange-500"></i> មុខម្ហូប
                    </h1>
                    <button onclick="window.openFoodModal()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg shadow-sm font-medium flex items-center gap-2 transition active:scale-95 text-sm md:text-base">
                        <i class="fas fa-plus"></i> <span class="hidden sm:inline">បន្ថែមមុខម្ហូប</span><span class="sm:hidden">បន្ថែម</span>
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 text-gray-600">
                                <th class="p-4 font-medium w-20">រូបភាព</th>
                                <th class="p-4 font-medium">ឈ្មោះមុខម្ហូប</th>
                                <th class="p-4 font-medium">ប្រភេទ</th>
                                <th class="p-4 font-medium">តម្លៃ ($)</th>
                                <th class="p-4 font-medium text-center w-28">សកម្មភាព</th>
                            </tr>
                        </thead>
                        <tbody id="foodsTableBody">
                            <tr><td colspan="5" class="p-8 text-center text-gray-500">កំពុងផ្ទុក...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal: បន្ថែម/កែប្រែ ប្រភេទម្ហូប (Category Modal) -->
    <div id="categoryModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center backdrop-blur-sm p-4">
        <div class="modal-content bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <!-- Modal Header (មានប៊ូតុងត្រឡប់ក្រោយ) -->
            <div class="p-4 border-b border-gray-100 flex items-center gap-3 bg-gray-50">
                <button onclick="window.closeModal('categoryModal')" class="text-gray-500 hover:text-gray-800 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 transition">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <h3 id="catModalTitle" class="text-lg font-bold text-gray-800 flex-1">បន្ថែមប្រភេទថ្មី</h3>
            </div>

            <form id="categoryForm" onsubmit="window.saveCategory(event)" class="p-5">
                <input type="hidden" id="c_id">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ឈ្មោះប្រភេទ <span class="text-red-500">*</span></label>
                    <input type="text" id="c_name" required class="w-full border border-gray-300 rounded-lg p-3 text-base focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="window.closeModal('categoryModal')" class="px-4 py-2.5 bg-gray-200 text-gray-700 rounded-lg font-medium flex items-center gap-2">
                        <i class="fas fa-times"></i> ត្រឡប់ក្រោយ
                    </button>
                    <button type="submit" id="btnSaveCategory" class="px-4 py-2.5 bg-orange-600 text-white rounded-lg hover:bg-orange-700 font-medium min-w-[100px] flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i> រក្សាទុក
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: បន្ថែម/កែប្រែ មុខម្ហូប (Food Modal) -->
    <div id="foodModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center backdrop-blur-sm p-4">
        <div class="modal-content bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Modal Header (មានប៊ូតុងត្រឡប់ក្រោយ) -->
            <div class="p-4 border-b border-gray-100 flex items-center gap-3 bg-gray-50">
                <button onclick="window.closeModal('foodModal')" class="
