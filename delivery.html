<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ម្ហូបស្នាដៃខ្មែរ - Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .nav-tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; font-weight: 700; }
        ::-webkit-scrollbar { display: none; }
        @keyframes ring-shake { 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(15deg);} 50%{transform:rotate(-15deg);} 75%{transform:rotate(15deg);} }
        .animate-ring { animation: ring-shake 0.5s infinite; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden relative">

    <div id="loginScreen" class="absolute inset-0 bg-white z-50 flex flex-col justify-center items-center p-6">
        <!-- ដាក់ Logo លើ Login អ្នកដឹក -->
        <div class="w-24 h-24 mb-4 shadow-sm rounded-full overflow-hidden border-4 border-blue-100">
            <img src="image_2.png" class="w-full h-full object-cover">
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">ម្ហូបស្នាដៃខ្មែរ</h1>
        <p class="text-gray-500 text-xs mb-6 text-center">កម្មវិធីអ្នកដឹកជញ្ជូន</p>
        
        <div class="w-full max-w-sm space-y-4">
            <div>
                <select id="driverSelect" class="w-full border border-gray-300 rounded-xl p-3.5 text-sm outline-none bg-gray-50"></select>
            </div>
            <div>
                <input type="password" id="driverPassword" placeholder="បញ្ចូលលេខសម្ងាត់ (Password)" class="w-full border border-gray-300 rounded-xl p-3.5 text-sm outline-none bg-gray-50">
            </div>
            <button onclick="window.loginDriver()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow">ចូលប្រព័ន្ធ <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <header class="bg-blue-600 shadow-md z-20 flex-shrink-0 text-white hidden" id="mainHeader">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- ដាក់ Logo ក្បែរឈ្មោះអ្នកដឹក -->
                <div class="bg-white/20 rounded-full w-10 h-10 flex items-center justify-center overflow-hidden border border-white/30">
                    <img src="image_2.png" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-bold" id="headerDriverName">ឈ្មោះអ្នកដឹក</h1>
                    <p class="text-[10px] text-blue-200">អ្នកដឹកជញ្ជូន</p>
                </div>
            </div>
            <button onclick="window.logoutDriver()" class="bg-white/10 px-3 py-1.5 rounded-lg text-xs">ចាកចេញ</button>
        </div>
        <div class="flex bg-white text-gray-500 text-xs border-b border-gray-200">
            <button onclick="window.switchTab('jobs')" id="nav-jobs" class="flex-1 py-3 nav-tab active"><i class="fas fa-box"></i> កំពុងដឹក <span id="badgeJobs" class="bg-red-500 text-white px-1.5 rounded-full hidden">0</span></button>
            <button onclick="window.switchTab('history')" id="nav-history" class="flex-1 py-3 nav-tab"><i class="fas fa-wallet"></i> ប្រវត្តិ</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-gray-50 p-4 pb-16 hidden" id="mainContent">
        <div id="tab-jobs" class="block"><div id="jobsList" class="flex flex-col gap-4"></div></div>
        <div id="tab-history" class="hidden"><div id="historyList"></div></div>
    </main>

    <div id="newJobAlertModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-80 z-[100] flex justify-center items-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center border-4 border-blue-500">
            <i class="fas fa-motorcycle text-5xl text-blue-500 animate-ring mb-4"></i>
            <h3 class="text-2xl font-bold mb-4">មានការងារថ្មី!</h3>
            <button onclick="window.closeNewJobAlert()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">ពិនិត្យមើល</button>
        </div>
    </div>
    
    <!-- (រក្សាកូដ JS Firebase ដដែល) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const app = initializeApp({ apiKey: "AIzaSyDWG8buz8xHyFigceq8u-qVX429344MlSs", projectId: "my-restaurant-app-5dd76" });
        const db = getFirestore(app);
        
        onSnapshot(collection(db, 'drivers'), snap => {
            let drivers = snap.docs.map(d=>({id:d.id, ...d.data()}));
            document.getElementById('driverSelect').innerHTML = drivers.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
            window.drivers = drivers;
        });

        window.loginDriver = () => {
            const id = document.getElementById('driverSelect').value, pwd = document.getElementById('driverPassword').value;
            const dr = window.drivers.find(d=>d.id===id);
            if(dr && dr.password === pwd) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('headerDriverName').textContent = dr.name;
            } else alert("លេខសម្ងាត់មិនត្រឹមត្រូវ!");
        };
        
        window.switchTab = (id) => { document.getElementById('tab-jobs').classList.toggle('hidden', id!=='jobs'); document.getElementById('tab-history').classList.toggle('hidden', id!=='history'); };
    </script>
</body>
</html>
