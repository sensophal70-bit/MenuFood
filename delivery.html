<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>កម្មវិធីអ្នកដឹកជញ្ជូន - Delivery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .nav-item.active { color: #ea580c; border-bottom: 3px solid #ea580c; font-weight: bold; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden relative">

    <div id="loginScreen" class="absolute inset-0 bg-white z-50 flex flex-col justify-center items-center p-6">
        <div class="w-20 h-20 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-sm"><i class="fas fa-motorcycle"></i></div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">កម្មវិធីអ្នកដឹកជញ្ជូន</h1>
        <p class="text-gray-500 text-sm mb-8 text-center">សូមជ្រើសរើសឈ្មោះរបស់អ្នក</p>
        <div class="w-full max-w-sm space-y-4">
            <select id="driverSelect" class="w-full border border-gray-300 rounded-xl p-4 text-base focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"><option value="">កំពុងទាញយក...</option></select>
            <button onclick="loginDriver()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition flex justify-center items-center gap-2">ចូលប្រព័ន្ធ <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <header class="bg-blue-600 shadow-md z-20 flex-shrink-0 text-white hidden" id="mainHeader">
        <div class="px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-full w-10 h-10 flex items-center justify-center"><i class="fas fa-motorcycle text-lg"></i></div>
                <div><h1 class="text-base font-bold leading-tight" id="headerDriverName">ឈ្មោះអ្នកដឹក</h1><p class="text-[11px] text-blue-200">Delivery Dashboard</p></div>
            </div>
            <button onclick="logoutDriver()" class="text-white/80 hover:text-white bg-white/10 px-3 py-1.5 rounded-lg text-xs font-medium backdrop-blur-sm transition">ចាកចេញ</button>
        </div>
        <div class="flex bg-white text-gray-500 text-sm">
            <button onclick="switchTab('jobs')" id="nav-jobs" class="flex-1 py-3.5 nav-item active transition flex items-center justify-center gap-2"><i class="fas fa-box"></i> កំពុងដឹក <span id="badgeJobs" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span></button>
            <button onclick="switchTab('history')" id="nav-history" class="flex-1 py-3.5 nav-item transition flex items-center justify-center gap-2"><i class="fas fa-wallet"></i> ប្រវត្តិ & ចំណូល</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-gray-50 p-4 pb-20 hidden" id="mainContent">
        <div id="tab-jobs" class="block space-y-4"><div id="jobsList" class="flex flex-col gap-4"></div></div>
        <div id="tab-history" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
                <h3 class="font-bold text-gray-800 text-sm border-l-4 border-blue-500 pl-2">របាយការណ៍ថ្ងៃនេះ</h3>
                <div class="grid grid-cols-2 gap-3 mt-1">
                    <div class="bg-green-50 p-3 rounded-xl border border-green-100"><p class="text-[11px] text-green-600 font-medium mb-1">ចំណូលថ្លៃដឹក (លុយអ្នក)</p><h4 class="text-xl font-bold text-green-700" id="totalDeliveryEarnings">$0.00</h4></div>
                    <div class="bg-orange-50 p-3 rounded-xl border border-orange-100"><p class="text-[11px] text-orange-600 font-medium mb-1">លុយថ្លៃម្ហូប (ត្រូវឲ្យហាង)</p><h4 class="text-xl font-bold text-orange-700" id="totalFoodMoney">$0.00</h4></div>
                </div>
            </div>
            <h3 class="font-bold text-gray-800 text-sm mt-6 mb-2">ការដឹកជញ្ជូនដែលបានបញ្ចប់</h3>
            <div id="historyList" class="flex flex-col gap-3"></div>
        </div>
    </main>

    <div id="toast" class="toast fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-full shadow-xl z-[60] flex items-center gap-3 font-medium text-sm w-max max-w-[90vw]"><i id="toastIcon" class="fas fa-check-circle text-green-400 text-lg"></i><span id="toastMessage">ជោគជ័យ!</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDWG8buz8xHyFigceq8u-qVX429344MlSs", authDomain: "my-restaurant-app-5dd76.firebaseapp.com", projectId: "my-restaurant-app-5dd76", storageBucket: "my-restaurant-app-5dd76.firebasestorage.app", messagingSenderId: "378764394320", appId: "1:378764394320:web:0d0b4cb2d9b6fa9d1a7655" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let drivers = [], myOrders = [], currentDriver = null;
        let dynamicFeePerKm = 0.50; // លុយដឹក Default បើ Admin មិនទាន់កំណត់

        // ស្តាប់ការផ្លាស់ប្តូរតម្លៃដឹកពី Admin ជានិច្ច
        onSnapshot(doc(db, 'settings', 'delivery'), (docSnap) => {
            if (docSnap.exists()) {
                dynamicFeePerKm = docSnap.data().feePerKm || 0.50;
            }
        });

        const savedDriverId = localStorage.getItem('delivery_driver_id');
        const savedDriverName = localStorage.getItem('delivery_driver_name');

        function init() {
            onSnapshot(collection(db, 'drivers'), (snapshot) => {
                drivers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('driverSelect').innerHTML = drivers.length === 0 ? '<option value="">គ្មានឈ្មោះទេ</option>' : '<option value="">-- សូមជ្រើសរើសឈ្មោះ --</option>' + drivers.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
                if (savedDriverId && drivers.find(d => d.id === savedDriverId)) { currentDriver = { id: savedDriverId, name: savedDriverName }; showMainApp(); }
            });
        }

        window.loginDriver = () => {
            const selId = document.getElementById('driverSelect').value; if (!selId) return showToast("សូមជ្រើសរើសឈ្មោះ!", "error");
            currentDriver = drivers.find(d => d.id === selId);
            localStorage.setItem('delivery_driver_id', currentDriver.id); localStorage.setItem('delivery_driver_name', currentDriver.name);
            showMainApp();
        };

        window.logoutDriver = () => { localStorage.clear(); window.location.reload(); };

        function showMainApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('headerDriverName').textContent = currentDriver.name;
            fetchMyOrders();
        }

        function fetchMyOrders() {
            onSnapshot(query(collection(db, 'orders'), where("driverId", "==", currentDriver.id)), (snapshot) => {
                myOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                myOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderJobs(); renderHistory();
            });
        }

        function renderJobs() {
            const pendingJobs = myOrders.filter(o => o.status === 'delivering');
            document.getElementById('badgeJobs').textContent = pendingJobs.length;
            document.getElementById('badgeJobs').classList.toggle('hidden', pendingJobs.length === 0);

            if (pendingJobs.length === 0) return document.getElementById('jobsList').innerHTML = `<div class="text-center text-gray-400 py-10">គ្មានការងារទេ</div>`;

            document.getElementById('jobsList').innerHTML = pendingJobs.map(order => {
                const itemsHtml = (order.items || []).map(i => `${i.quantity}x ${i.name}`).join(', ');
                return `
                <div class="bg-white rounded-xl shadow-sm border p-4">
                    <div class="flex justify-between items-start border-b pb-3 mb-3">
                        <div><h3 class="font-bold text-lg"><i class="fas fa-user text-blue-500"></i> ${escapeHTML(order.customerName)}</h3><p class="text-xs text-gray-500 mt-1">${escapeHTML(itemsHtml)}</p></div>
                        <div class="text-right"><span class="text-xs text-gray-500">តម្លៃម្ហូប</span><div class="font-bold text-orange-600 text-lg">$${parseFloat(order.totalPrice||0).toFixed(2)}</div></div>
                    </div>
                    <div class="flex gap-2 mb-3">
                        <a href="${order.telegram}" target="_blank" class="flex-1 bg-blue-50 text-blue-600 py-2 rounded text-center text-xs font-bold"><i class="fab fa-telegram"></i> ទាក់ទងភ្ញៀវ</a>
                        <a href="${order.location}" target="_blank" class="flex-1 bg-green-50 text-green-600 py-2 rounded text-center text-xs font-bold"><i class="fas fa-map-marker-alt"></i> មើលផែនទី</a>
                    </div>
                    <div class="border rounded p-3 mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-bold text-gray-600">តម្លៃដឹក</label>
                            <button onclick="calculateDeliveryFee('${order.id}', '${order.location}')" class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded">គណនាចម្ងាយ</button>
                        </div>
                        <input type="number" step="0.01" id="fee_input_${order.id}" class="w-full text-lg font-bold border-b outline-none pb-1" oninput="updateGrandTotal('${order.id}', ${order.totalPrice||0})">
                        <p id="dist_label_${order.id}" class="text-[10px] text-gray-400 mt-1">វាយតម្លៃផ្ទាល់ ឬចុចគណនា</p>
                    </div>
                    <div class="flex justify-between items-center bg-orange-50 rounded p-3 mb-3">
                        <span class="text-sm font-bold">សរុបទារភ្ញៀវ៖</span>
                        <span class="text-xl font-bold text-orange-600" id="grand_total_${order.id}">$${parseFloat(order.totalPrice||0).toFixed(2)}</span>
                    </div>
                    <button onclick="window.completeDelivery('${order.id}')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg"><i class="fas fa-check"></i> បញ្ចប់ការដឹក</button>
                </div>`;
            }).join('');
        }

        window.updateGrandTotal = (orderId, foodTotal) => {
            const fee = parseFloat(document.getElementById(`fee_input_${orderId}`).value) || 0;
            document.getElementById(`grand_total_${orderId}`).textContent = `$${(parseFloat(foodTotal) + fee).toFixed(2)}`;
        };

        window.calculateDeliveryFee = (orderId, customerMapUrl) => {
            const distLabel = document.getElementById(`dist_label_${orderId}`);
            let cusLat = null, cusLng = null;
            try { const match = customerMapUrl.match(/q=([\d.-]+),([\d.-]+)/); if (match) { cusLat = parseFloat(match[1]); cusLng = parseFloat(match[2]); } } catch(e) {}
            if (!cusLat) return showToast("ទីតាំងភ្ញៀវមិនត្រឹមត្រូវ", "error");

            distLabel.textContent = "កំពុងចាប់ទីតាំង...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const dLat = (cusLat - pos.coords.latitude) * (Math.PI/180), dLon = (cusLng - pos.coords.longitude) * (Math.PI/180);
                    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(pos.coords.latitude*(Math.PI/180))*Math.cos(cusLat*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
                    const distKm = 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                    let fee = distKm * dynamicFeePerKm; if(fee < 0.5) fee = 0.5;
                    
                    distLabel.innerHTML = `<span class="text-green-600 font-bold">ចម្ងាយ៖ ${distKm.toFixed(2)}Km (គិត $${dynamicFeePerKm}/Km)</span>`;
                    document.getElementById(`fee_input_${orderId}`).value = fee.toFixed(2);
                    document.getElementById(`fee_input_${orderId}`).dispatchEvent(new Event('input'));
                }, () => showToast("សូមបើក GPS", "error"), { enableHighAccuracy: true });
            }
        };

        window.completeDelivery = async (orderId) => {
            if (!confirm("បញ្ជូនរួចរាល់?")) return;
            const fee = parseFloat(document.getElementById(`fee_input_${orderId}`).value) || 0;
            await updateDoc(doc(db, `orders`, orderId), { status: 'completed', deliveryFee: fee, completedAt: new Date().toISOString() });
            showToast("ជោគជ័យ");
        };

        function renderHistory() {
            const doneJobs = myOrders.filter(o => o.status === 'completed' || o.status === 'រួចរាល់ (Completed)');
            const todayStr = new Date().toLocaleDateString('km-KH');
            let earnDel = 0, earnFood = 0;
            
            const listHtml = doneJobs.map(order => {
                const dateObj = new Date(order.completedAt || order.createdAt);
                if (dateObj.toLocaleDateString('km-KH') === todayStr) { earnDel += parseFloat(order.deliveryFee||0); earnFood += parseFloat(order.totalPrice||0); }
                return `
                <div class="bg-white border rounded-xl p-3 flex flex-col">
                    <div class="flex justify-between mb-2"><h3 class="font-bold text-sm">${escapeHTML(order.customerName)}</h3><span class="text-[10px] text-gray-400">${dateObj.toLocaleString('km-KH')}</span></div>
                    <div class="flex justify-between text-xs"><span>តម្លៃម្ហូប៖</span><span class="font-bold">$${parseFloat(order.totalPrice||0).toFixed(2)}</span></div>
                    <div class="flex justify-between text-xs"><span>តម្លៃដឹក៖</span><span class="font-bold text-green-600">+$${parseFloat(order.deliveryFee||0).toFixed(2)}</span></div>
                </div>`;
            }).join('');

            document.getElementById('totalDeliveryEarnings').textContent = `$${earnDel.toFixed(2)}`;
            document.getElementById('totalFoodMoney').textContent = `$${earnFood.toFixed(2)}`;
            document.getElementById('historyList').innerHTML = doneJobs.length ? listHtml : `<div class="text-center text-gray-400 py-10">គ្មានប្រវត្តិទេ</div>`;
        }

        window.switchTab = (tabId) => {
            ['jobs', 'history'].forEach(id => { document.getElementById('tab-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active'); });
            document.getElementById('tab-'+tabId).classList.remove('hidden'); document.getElementById('nav-'+tabId).classList.add('active');
        };
        function showToast(msg, type='success') { document.getElementById('toastMessage').textContent=msg; document.getElementById('toast').classList.add('show'); setTimeout(()=>document.getElementById('toast').classList.remove('show'),3000); }

        init();
    </script>
</body>
</html>
