<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ម្ហូបស្នាដៃខ្មែរ - Order Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .cart-slide { transform: translateX(100%); transition: transform 0.3s ease; }
        .modal-overlay.active .cart-slide { transform: translateX(0); }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .cat-btn { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .cat-btn.active { background-color: #ea580c; color: white; border-color: #ea580c; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm z-20 flex-shrink-0 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5 text-orange-600">
                <!-- ដាក់ Logo នៅ Header -->
                <img src="image_2.png" alt="ម្ហូបស្នាដៃខ្មែរ" class="w-10 h-10 rounded-full border-2 border-orange-100 shadow-sm object-cover">
                <span class="text-lg font-bold tracking-tight">ម្ហូបស្នាដៃខ្មែរ</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="historyToggleBtn" class="relative p-2 text-gray-500 hover:text-orange-600 transition bg-gray-50 rounded-full h-10 w-10 flex items-center justify-center shadow-sm border border-gray-100"><i class="fas fa-history"></i></button>
                <button id="cartToggleBtn" class="relative p-2 text-gray-600 hover:text-orange-600 transition bg-gray-50 rounded-full h-10 w-10 flex items-center justify-center shadow-sm border border-gray-100"><i class="fas fa-shopping-cart"></i><span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow hidden">0</span></button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto flex flex-col">
        <div class="bg-gradient-to-r from-orange-50 to-orange-100 py-6 px-4 text-center border-b border-orange-200 shrink-0">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">កុម្ម៉ង់អាហារដែលអ្នកចូលចិត្ត</h1>
            <p class="text-gray-600 text-xs">សេវាកម្មរហ័សទាន់ចិត្ត រក្សាអនាម័យខ្ពស់។</p>
        </div>

        <div class="max-w-7xl mx-auto w-full px-4 pt-4 pb-2 shrink-0 sticky top-0 bg-[#f8fafc] z-10 shadow-sm border-b border-gray-100">
            <div class="relative mb-3">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><i class="fas fa-search text-sm"></i></div>
                <input type="text" id="searchInput" placeholder="ស្វែងរកមុខម្ហូប..." class="w-full border border-gray-200 rounded-xl pl-9 p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none shadow-sm bg-white">
            </div>
            <div class="flex overflow-x-auto hide-scrollbar gap-2 pb-1" id="categoryContainer"><button class="cat-btn active whitespace-nowrap px-4 py-1.5 rounded-full font-medium text-xs shadow-sm">ទាំងអស់</button></div>
        </div>

        <div class="max-w-7xl mx-auto w-full px-4 py-4 flex-1">
            <div id="foodGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5">
                <div class="animate-pulse flex flex-col gap-2 bg-white p-2.5 rounded-xl shadow-sm"><div class="bg-gray-200 h-28 w-full rounded-lg"></div><div class="h-3 bg-gray-200 rounded w-3/4 mt-1"></div></div>
            </div>
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex justify-end backdrop-blur-sm">
        <div class="cart-slide bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0"><h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-shopping-bag text-orange-500"></i> កន្ត្រកទំនិញ</h3><button id="closeCartBtn" class="text-gray-400 hover:text-red-500 bg-white rounded-full h-8 w-8 flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button></div>
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>
            <div class="shrink-0 bg-white shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.1)] z-10">
                <form id="checkoutForm" class="p-4 border-b border-gray-100 bg-gray-50">
                    <h4 class="font-semibold text-gray-700 text-sm mb-2"><i class="fas fa-id-card text-orange-500 mr-1"></i> ព័ត៌មានអតិថិជន</h4>
                    <input type="text" id="cusName" required placeholder="ឈ្មោះរបស់អ្នក (Name) *" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none shadow-sm">
                    <input type="hidden" id="cusTelegram"><input type="hidden" id="cusLocation">
                </form>
                <div class="p-4"><div class="flex justify-between items-center mb-4 text-base"><span class="text-gray-600 font-bold">សរុប (មុខម្ហូប)៖</span><span id="cartTotalPrice" class="text-xl font-bold text-orange-600">$0.00</span></div><button type="submit" form="checkoutForm" id="btnCheckout" disabled class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl disabled:opacity-50">បញ្ជាក់ការកុម្ម៉ង់ <i class="fas fa-check-circle"></i></button></div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex justify-end backdrop-blur-sm">
        <div class="cart-slide bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0"><h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-history text-orange-500"></i> ប្រវត្តិការកុម្ម៉ង់</h3><button id="closeHistoryBtn" class="text-gray-400 hover:text-red-500 bg-white rounded-full h-8 w-8 flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button></div>
            <div id="historyItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>
        </div>
    </div>

    <div id="toast" class="toast fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-xl z-[60] flex items-center gap-3 font-medium text-sm w-max max-w-[90vw]"><i id="toastIcon" class="fas fa-check-circle text-green-400 text-lg"></i><span id="toastMessage">ជោគជ័យ!</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN_HERE';
        const TELEGRAM_CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID_HERE';

        const firebaseConfig = { apiKey: "AIzaSyDWG8buz8xHyFigceq8u-qVX429344MlSs", authDomain: "my-restaurant-app-5dd76.firebaseapp.com", projectId: "my-restaurant-app-5dd76", storageBucket: "my-restaurant-app-5dd76.firebasestorage.app", messagingSenderId: "378764394320", appId: "1:378764394320:web:0d0b4cb2d9b6fa9d1a7655" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let foodsList=[], categoriesList=[], cart=[], myOrdersHistory=[];
        let deviceId = localStorage.getItem('app_device_id');
        let currentCategory = 'all', searchQuery = '';

        if (!deviceId) { deviceId = 'dev_' + Math.random().toString(36).substr(2, 10) + Date.now(); localStorage.setItem('app_device_id', deviceId); }

        function init() { fetchCategories(); fetchFoods(); autoDetectTelegram(); fetchAutoLocation(); fetchMyOrderHistory(); }
        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderFoods(); });

        function autoDetectTelegram() {
            const nameInput = document.getElementById('cusName'), teleInput = document.getElementById('cusTelegram');
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser) { const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' '); if (fullName) nameInput.value = fullName; if (tgUser.username) teleInput.value = `https://t.me/${tgUser.username}`; else if (tgUser.id) teleInput.value = `tg://user?id=${tgUser.id}`; }
            }
            if (!nameInput.value && localStorage.getItem('last_customer_name')) nameInput.value = localStorage.getItem('last_customer_name');
        }
        function fetchAutoLocation() { const locInput = document.getElementById('cusLocation'); if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(pos => { locInput.value = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`; }, err => { locInput.value = "មិនបានអនុញ្ញាតទីតាំង"; }, { enableHighAccuracy: true, timeout: 10000 }); } else locInput.value = "មិនគាំទ្រ GPS"; }
        function fetchCategories() { onSnapshot(collection(db, 'categories'), (snapshot) => { categoriesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderCategories(); }); }
        function renderCategories() { let html = `<button onclick="window.filterCategory('all')" class="cat-btn ${currentCategory === 'all' ? 'active' : ''} px-4 py-1.5 rounded-full text-xs">ទាំងអស់</button>`; categoriesList.forEach(cat => { html += `<button onclick="window.filterCategory('${cat.id}')" class="cat-btn ${currentCategory === cat.id ? 'active' : ''} px-4 py-1.5 rounded-full text-xs">${escapeHTML(cat.name)}</button>`; }); document.getElementById('categoryContainer').innerHTML = html; }
        window.filterCategory = (catId) => { currentCategory = catId; renderCategories(); renderFoods(); };
        function fetchFoods() { onSnapshot(collection(db, 'foods'), (snapshot) => { foodsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderFoods(); }, () => { document.getElementById('foodGrid').innerHTML = `<p class="text-red-500 col-span-full text-center">បញ្ហាញទិន្នន័យបរាជ័យ!</p>`; }); }
        
        function renderFoods() {
            let f = foodsList;
            if (currentCategory !== 'all') f = f.filter(x => x.categoryId === currentCategory);
            if (searchQuery.trim() !== '') f = f.filter(x => (x.name || '').toLowerCase().includes(searchQuery));
            if (f.length === 0) return document.getElementById('foodGrid').innerHTML = `<div class="col-span-full py-10 flex flex-col items-center text-gray-400"><p class="text-sm">រកមិនឃើញ</p></div>`;
            document.getElementById('foodGrid').innerHTML = f.map(food => `<div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col"><div class="h-28 sm:h-36"><img src="${food.imageUrl || food.image}" class="w-full h-full object-cover"></div><div class="p-2.5 flex-1 flex flex-col"><h3 class="text-sm font-bold leading-tight mb-1">${escapeHTML(food.name)}</h3><div class="flex justify-between items-center mt-auto pt-2 border-t"><span class="text-orange-600 font-bold">$${parseFloat(food.price||0).toFixed(2)}</span><button onclick="window.addToCart('${food.id}')" class="px-2 py-1 bg-orange-50 text-orange-600 rounded text-xs"><i class="fas fa-plus"></i></button></div></div></div>`).join('');
        }

        window.addToCart = (id) => { const f = foodsList.find(x=>x.id===id); if(!f) return; const e = cart.find(x=>x.id===id); if(e) e.quantity++; else cart.push({...f, quantity:1}); updateCartUI(); showToast("បានបន្ថែម", "success"); };
        window.updateQuantity = (id, d) => { const i = cart.find(x=>x.id===id); if(!i) return; i.quantity+=d; if(i.quantity<=0) cart=cart.filter(x=>x.id!==id); updateCartUI(); };
        window.removeFromCart = (id) => { cart = cart.filter(x=>x.id!==id); updateCartUI(); };
        
        function updateCartUI() {
            const t = cart.reduce((s,i)=>s+i.quantity,0);
            if(t>0){ document.getElementById('cartBadge').textContent=t; document.getElementById('cartBadge').classList.remove('hidden'); } else document.getElementById('cartBadge').classList.add('hidden');
            if(cart.length===0){ document.getElementById('cartItemsContainer').innerHTML=`<p class="text-center text-gray-400 mt-10">គ្មានទំនិញ</p>`; document.getElementById('cartTotalPrice').textContent='$0.00'; document.getElementById('btnCheckout').disabled=true; return; }
            document.getElementById('btnCheckout').disabled=false; let cost=0;
            document.getElementById('cartItemsContainer').innerHTML = cart.map(i => {
                cost+=i.price*i.quantity; return `<div class="flex gap-2 p-2 bg-white border rounded items-center"><img src="${i.imageUrl}" class="w-12 h-12 rounded object-cover"><div class="flex-1"><h4 class="font-bold text-xs">${escapeHTML(i.name)}</h4><div class="text-orange-600 font-bold text-sm">$${(i.price*i.quantity).toFixed(2)}</div></div><div class="flex items-center gap-2"><button onclick="window.updateQuantity('${i.id}',-1)" class="w-6 h-6 bg-gray-100 rounded">-</button><span>${i.quantity}</span><button onclick="window.updateQuantity('${i.id}',1)" class="w-6 h-6 bg-gray-100 rounded">+</button></div></div>`;
            }).join('');
            document.getElementById('cartTotalPrice').textContent = `$${cost.toFixed(2)}`;
        }

        function fetchMyOrderHistory() {
            onSnapshot(query(collection(db, 'orders'), where("deviceId", "==", deviceId)), (snap) => {
                myOrdersHistory = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
                if(myOrdersHistory.length===0) return document.getElementById('historyItemsContainer').innerHTML=`<p class="text-center text-gray-400 mt-10">គ្មានប្រវត្តិ</p>`;
                document.getElementById('historyItemsContainer').innerHTML = myOrdersHistory.map(o => {
                    let col = o.status==='completed'?'text-green-600':(o.status==='delivering'?'text-blue-600':'text-yellow-600');
                    let stat = o.status==='completed'?'រួចរាល់':(o.status==='delivering'?'កំពុងដឹក':'រង់ចាំ');
                    return `<div class="bg-white border p-3 rounded mb-2"><div class="flex justify-between text-xs mb-2"><span>${new Date(o.createdAt).toLocaleString('km-KH')}</span><b class="${col}">${stat}</b></div>${(o.items||[]).map(i=>`<div class="text-xs flex justify-between"><span>${i.quantity}x ${escapeHTML(i.name)}</span><span>$${(i.price*i.quantity).toFixed(2)}</span></div>`).join('')}<div class="border-t mt-2 pt-2 text-xs flex justify-between"><span>ថ្លៃដឹក: $${(parseFloat(o.deliveryFee)||0).toFixed(2)}</span><b class="text-orange-600">សរុប: $${(parseFloat(o.totalPrice)+(parseFloat(o.deliveryFee)||0)).toFixed(2)}</b></div></div>`;
                }).join('');
            });
        }

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault(); if (cart.length === 0) return;
            const cName = document.getElementById('cusName').value.trim(); localStorage.setItem('last_customer_name', cName);
            const total = cart.reduce((s,i)=>s+(i.price*i.quantity),0);
            const data = { userId: 'guest', deviceId, customerName: cName, telegram: document.getElementById('cusTelegram').value.trim()||'គ្មាន', location: document.getElementById('cusLocation').value.trim()||'គ្មាន', items: cart.map(i=>({id:i.id, name:i.name, price:i.price, quantity:i.quantity})), totalPrice: total, status: 'pending', createdAt: new Date().toISOString() };
            document.getElementById('btnCheckout').disabled=true;
            try { await addDoc(collection(db, 'orders'), data); cart=[]; document.getElementById('checkoutForm').reset(); updateCartUI(); toggleModal('cartModal'); setTimeout(()=>toggleModal('historyModal'), 500); showToast("ជោគជ័យ", "success"); } catch (err) { showToast("បរាជ័យ", "error"); } finally { document.getElementById('btnCheckout').disabled=false; }
        });

        function toggleModal(id) { const m = document.getElementById(id); document.getElementById(id==='cartModal'?'historyModal':'cartModal').classList.remove('active'); m.classList.toggle('active'); if(id==='cartModal'&&m.classList.contains('active')) fetchAutoLocation(); }
        document.getElementById('cartToggleBtn').onclick=()=>toggleModal('cartModal'); document.getElementById('historyToggleBtn').onclick=()=>toggleModal('historyModal');
        document.getElementById('closeCartBtn').onclick=()=>toggleModal('cartModal'); document.getElementById('closeHistoryBtn').onclick=()=>toggleModal('historyModal');
        function showToast(m, t="success") { document.getElementById('toastMessage').textContent=m; document.getElementById('toast').classList.add('show'); setTimeout(()=>document.getElementById('toast').classList.remove('show'),3000); }
        function escapeHTML(str) { return str?String(str).replace(/[&<>'"]/g, t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)):''; }
        init();
    </script>
</body>
</html>
