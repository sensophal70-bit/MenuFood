<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>អាហារដ្ឋាន រសជាតិខ្មែរ - កម្មង់ម្ហូបអនឡាញ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kantumruy Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center text-white text-xl shadow-md shadow-orange-200">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 id="storeNameHeader" class="font-bold text-lg text-slate-900 leading-tight">អាហារដ្ឋាន រសជាតិខ្មែរ</h1>
                    <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> បើកលក់ • ដឹកជញ្ជូនរហ័សទាន់ចិត្ត
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <!-- Track Order & Chat Button -->
                <button onclick="switchTab('tracking')" id="navTrackingBtn" class="relative px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-motorcycle text-orange-600"></i>
                    <span class="hidden sm:inline">តាមដាន & ឆាត</span>
                    <span id="activeOrderBadge" class="hidden absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-[10px] font-bold items-center justify-center">0</span>
                </button>

                <!-- Shopping Cart Button -->
                <button onclick="toggleCartModal(true)" class="relative px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-sm font-semibold shadow-md shadow-orange-200 transition flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span id="cartCountBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pt-5">

        <!-- VIEW 1: STOREFRONT & MENU -->
        <section id="menuView" class="space-y-6">
            <!-- Hero Banner -->
            <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-slate-900 via-slate-800 to-orange-950 text-white p-6 sm:p-8 shadow-lg">
                <div class="relative z-10 max-w-lg space-y-2">
                    <span class="inline-block px-3 py-1 rounded-full bg-orange-500/20 border border-orange-400/30 text-orange-300 text-xs font-semibold">
                        🔥 កម្មង់ភ្លាម ចម្អិនភ្លាមៗ
                    </span>
                    <h2 class="text-2xl sm:text-3xl font-bold leading-snug">ម្ហូបឆ្ងាញ់ៗ ដឹកជញ្ជូនដល់មុខផ្ទះរបស់អ្នក!</h2>
                    <p class="text-xs sm:text-sm text-slate-300">ភ្ជាប់ប្រព័ន្ធ Telegram ផ្ទាល់ ងាយស្រួលតាមដានម្ហូប និងជជែកជាមួយចុងភៅ ឬអ្នកដឹកជញ្ជូន។</p>
                </div>
                <i class="fa-solid fa-bowl-food absolute -right-6 -bottom-6 text-9xl text-white/5 transform -rotate-12"></i>
            </div>

            <!-- Search & Category Filter -->
            <div class="space-y-3 sticky top-[68px] z-30 bg-[#f8fafc] py-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderMenu()" placeholder="ស្វែងរកឈ្មោះម្ហូប ឬភេសជ្ជៈ..." 
                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none text-sm shadow-sm transition">
                </div>

                <!-- Categories -->
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1" id="categoryTabs">
                    <button onclick="selectCategory('ទាំងអស់')" data-cat="ទាំងអស់" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-orange-600 text-white shadow-sm transition">ទាំងអស់</button>
                    <button onclick="selectCategory('ម្ហូបគោល')" data-cat="ម្ហូប
