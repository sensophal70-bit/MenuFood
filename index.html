<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>កម្មវិធីកុម្ម៉ង់ម្ហូប - Order Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram SDK សម្រាប់ចាប់ទិន្នន័យស្វ័យប្រវត្តិ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .cart-slide { transform: translateX(100%); transition: transform 0.3s ease; }
        .modal-overlay.active .cart-slide { transform: translateX(0); }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm z-20 flex-shrink-0 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3 text-orange-600">
                <div class="bg-orange-100 p-2.5 rounded-full flex items-center justify-center">
                    <i class="fas fa-utensils text-xl"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">ម្ហូបឆ្ងាញ់ៗ</span>
            </div>
            <button id="cartToggleBtn" class="relative p-2 text-gray-600 hover:text-orange-600 transition bg-gray-50 rounded-full h-11 w-11 flex items-center justify-center shadow-sm border border-gray-100">
                <i class="fas fa-shopping-cart text-lg"></i>
                <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <div class="bg-gradient-to-r from-orange-50 to-orange-100 py-10 px-4 text-center border-b border-orange-200">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">កុម្ម៉ង់អាហារដែលអ្នកចូលចិត្ត</h1>
            <p class="text-gray-600 max-w-lg mx-auto text-sm">សេវាកម្មរហ័សទាន់ចិត្ត រក្សាអនាម័យខ្ពស់ ផ្ដល់ជូនរសជាតិដ៏វិសេសវិសាល។</p>
        </div>

        <div class="max-w-7xl mx-auto px-4 py-8">
            <h2 class="text-xl font-bold mb-6 text-gray-800 flex items-center gap-2 border-l-4 border-orange-500 pl-3">
                បញ្ជីមុខម្ហូប
            </h2>
            <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <div class="animate-pulse flex flex-col gap-3 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                    <div class="bg-gray-200 h-40 w-full rounded-xl"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4 mt-2"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex justify-end backdrop-blur-sm">
        <div class="cart-slide bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-shopping-bag text-orange-500"></i> កន្ត្រកទំនិញ
                </h3>
                <button id="closeCartBtn" class="text-gray-400 hover:text-red-500 bg-white rounded-full h-8 w-8 flex items-center justify-center shadow-sm">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Cart Items -->
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50">
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <i class="fas fa-basket-shopping text-4xl mb-3 opacity-40"></i>
                    <p>មិនទាន់មានមុខម្ហូបទេ</p>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="shrink-0 bg-white shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.1)] z-10">
                <form id="checkoutForm" class="p-4 border-b border-gray-100 bg-gray-50">
                    <h4 class="font-semibold text-gray-700 text-sm mb-3"><i class="fas fa-id-card text-orange-500 mr-1"></i> ព័ត៌មានអតិថិជន</h4>
                    
                    <!-- បង្ហាញតែឈ្មោះ -->
                    <input type="text" id="cusName" required placeholder="ឈ្មោះរបស់អ្នក (Name) *" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none shadow-sm">
                    
                    <!-- លាក់ Telegram និង ទីតាំង -->
                    <input type="hidden" id="cusTelegram">
                    <input type="hidden" id="cusLocation">
                </form>

                <div class="p-4">
                    <div class="flex justify-between items-center mb-4 text-lg">
                        <span class="text-gray-600 font-bold">សរុប (Total)៖</span>
                        <span id="cartTotalPrice" class="text-2xl font-bold text-orange-600">$0.00</span>
                    </div>
                    <button type="submit" form="checkoutForm" id="btnCheckout" disabled class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-md transition transform active:scale-[0.98] flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        បញ្ជាក់ការកុម្ម៉ង់ <i class="fas fa-check-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-xl z-[60] flex items-center gap-3 font-medium text-sm pointer-events-none w-max max-w-[90vw]">
        <i id="toastIcon" class="fas fa-check-circle text-green-400 text-lg"></i>
        <span id="toastMessage">ជោគជ័យ!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN_HERE';
        const TELEGRAM_CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID_HERE';
        // ==========================================

        const firebaseConfig = {
          apiKey: "AIzaSyDWG8buz8xHyFigceq8u-qVX429344MlSs",
          authDomain: "my-restaurant-app-5dd76.firebaseapp.com",
          projectId: "my-restaurant-app-5dd76",
          storageBucket: "my-restaurant-app-5dd76.firebasestorage.app",
          messagingSenderId: "378764394320",
          appId: "1:378764394320:web:0d0b4cb2d9b6fa9d1a7655"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const FOODS_PATH = `foods`;
        const ORDERS_PATH = `orders`;

        let foodsList = [];
        let cart = [];

        const foodGrid = document.getElementById('foodGrid');
        const cartModal = document.getElementById('cartModal');
        const cartToggleBtn = document.getElementById('cartToggleBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartBadge = document.getElementById('cartBadge');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const checkoutForm = document.getElementById('checkoutForm');
        const btnCheckout = document.getElementById('btnCheckout');
        const toastEl = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        function init() {
            fetchFoods();
            autoDetectTelegram();
            fetchAutoLocation();
        }

        // ១. ចាប់យកឈ្មោះ និង Link Telegram ស្វ័យប្រវត្តិ
        function autoDetectTelegram() {
            const nameInput = document.getElementById('cusName');
            const teleInput = document.getElementById('cusTelegram');

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser) {
                    const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
                    if (fullName) nameInput.value = fullName;
                    
                    if (tgUser.username) {
                        teleInput.value = `https://t.me/${tgUser.username}`;
                    } else if (tgUser.id) {
                        teleInput.value = `tg://user?id=${tgUser.id}`;
                    }
                }
            }
            // ទាញឈ្មោះចាស់បើធ្លាប់កុម្ម៉ង់
            if (!nameInput.value && localStorage.getItem('last_customer_name')) {
                nameInput.value = localStorage.getItem('last_customer_name');
            }
        }

        // ២. ចាប់យកទីតាំងស្វ័យប្រវត្តិលាក់ពីក្រោយ
        function fetchAutoLocation() {
            const locInput = document.getElementById('cusLocation');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        locInput.value = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    },
                    (err) => {
                        locInput.value = "មិនបានអនុញ្ញាតទីតាំង (No GPS)";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                locInput.value = "ឧបករណ៍មិនគាំទ្រ GPS";
            }
        }

        function fetchFoods() {
            onSnapshot(collection(db, FOODS_PATH), (snapshot) => {
                foodsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderFoods();
            }, (error) => {
                foodGrid.innerHTML = `<p class="text-red-500 col-span-full text-center py-10">មិនអាចទាញយកបញ្ជីមុខម្ហូបបានទេ!</p>`;
            });
        }

        function renderFoods() {
            if (foodsList.length === 0) {
                foodGrid.innerHTML = `
                    <div class="col-span-full py-16 flex flex-col items-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">
                        <i class="fas fa-utensils text-4xl mb-3 opacity-30"></i>
                        <p class="text-base font-medium">មិនទាន់មានមុខម្ហូបនៅឡើយទេ</p>
                    </div>`;
                return;
            }

            foodGrid.innerHTML = foodsList.map(food => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col">
                    <div class="relative h-44 overflow-hidden bg-gray-50">
                        <img src="${food.imageUrl || food.image || 'https://placehold.co/400x300/f8fafc/94a3b8?text=Food'}" 
                             alt="${escapeHTML(food.name)}" 
                             class="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                             onerror="this.src='https://placehold.co/400x300/f8fafc/94a3b8?text=No+Image'">
                    </div>
                    <div class="p-3.5 flex-1 flex flex-col">
                        <h3 class="text-sm font-bold text-gray-900 leading-tight line-clamp-2 mb-1">${escapeHTML(food.name)}</h3>
                        <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-50">
                            <span class="text-orange-600 font-bold text-base">$${parseFloat(food.price || 0).toFixed(2)}</span>
                            <button onclick="window.addToCart('${food.id}')" 
                                    class="py-1.5 px-3 bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white rounded-lg font-medium transition-colors flex items-center gap-1.5 text-xs">
                                <i class="fas fa-plus"></i> បន្ថែម
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.addToCart = (foodId) => {
            const food = foodsList.find(f => f.id === foodId);
            if (!food) return;

            const existing = cart.find(item => item.id === foodId);
            if (existing) existing.quantity += 1;
            else cart.push({ ...food, quantity: 1 });

            updateCartUI();
            showToast(`បានបន្ថែម "${food.name}"`, "success");
        };

        window.updateQuantity = (foodId, delta) => {
            const item = cart.find(i => i.id === foodId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== foodId);
            updateCartUI();
        };

        // មុខងារលុបពីកន្ត្រក (Delete Button)
        window.removeFromCart = (foodId) => {
            cart = cart.filter(i => i.id !== foodId);
            updateCartUI();
        };

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (totalItems > 0) {
                cartBadge.textContent = totalItems;
                cartBadge.classList.remove('hidden');
            } else {
                cartBadge.classList.add('hidden');
            }

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 mt-10">
                        <i class="fas fa-shopping-basket text-5xl mb-4 opacity-30"></i>
                        <p>មិនមានទំនិញទេ</p>
                    </div>`;
                cartTotalPrice.textContent = '$0.00';
                btnCheckout.disabled = true;
                return;
            }

            btnCheckout.disabled = false;
            let totalCost = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                totalCost += itemTotal;
                return `
                    <div class="flex gap-3 p-3 bg-white border border-gray-200 rounded-xl shadow-sm items-center relative">
                        <img src="${item.imageUrl || item.image}" class="w-16 h-16 rounded-lg object-cover bg-gray-100" onerror="this.src='https://placehold.co/100?text=Food'">
                        <div class="flex-1 min-w-0 pr-6">
                            <h4 class="font-bold text-gray-800 text-sm leading-tight mb-1">${escapeHTML(item.name)}</h4>
                            <!-- បង្ហាញតម្លៃរាយ x ចំនួន -->
                            <div class="text-xs text-gray-500 mb-0.5">$${parseFloat(item.price).toFixed(2)} x ${item.quantity}</div>
                            <!-- បង្ហាញតម្លៃសរុបប្រចាំមុខ -->
                            <div class="text-orange-600 font-bold text-sm">$${itemTotal.toFixed(2)}</div>
                        </div>
                        
                        <div class="flex flex-col items-end gap-2">
                            <!-- ប៊ូតុងលុប (Trash) -->
                            <button onclick="window.removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600 p-1 transition" title="លុបមុខម្ហូបនេះ">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <!-- ប៊ូតុងបូកដក -->
                            <div class="flex items-center gap-1.5 bg-gray-50 rounded-lg p-1 border border-gray-200">
                                <button onclick="window.updateQuantity('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center text-gray-600 hover:text-red-500 bg-white rounded shadow-sm"><i class="fas fa-minus text-xs"></i></button>
                                <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="window.updateQuantity('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center text-gray-600 hover:text-green-500 bg-white rounded shadow-sm"><i class="fas fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            cartTotalPrice.textContent = `$${totalCost.toFixed(2)}`;
        }

        async function sendOrderToTelegram(orderData, totalAmount) {
            if (TELEGRAM_BOT_TOKEN === 'YOUR_TELEGRAM_BOT_TOKEN_HERE') return; 

            let itemsListStr = '';
            orderData.items.forEach(item => {
                itemsListStr += `- ${item.name} (x${item.quantity}) = $${(item.price * item.quantity).toFixed(2)}\n`;
            });

            const teleLink = orderData.telegram.startsWith('http') || orderData.telegram.startsWith('tg://') ? `<a href="${orderData.telegram}">មើលគណនីអតិថិជន</a>` : orderData.telegram;
            const mapLink = orderData.location.startsWith('http') ? `<a href="${orderData.location}">មើលលើ Google Maps</a>` : orderData.location;

            const message = `🔔 <b>មានការកុម្ម៉ង់ថ្មី!</b>\n` +
                            `👤 ឈ្មោះអតិថិជន: <b>${orderData.customerName}</b>\n` +
                            `💬 Telegram: ${teleLink}\n` +
                            `📍 ទីតាំង GPS: ${mapLink}\n` +
                            `------------------------\n` +
                            `🛒 <b>មុខម្ហូប:</b>\n${itemsListStr}` +
                            `------------------------\n` +
                            `💰 <b>សរុប: $${totalAmount.toFixed(2)}</b>\n` +
                            `⏰ ម៉ោង: ${new Date().toLocaleString('km-KH')}`;

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'HTML' })
                });
            } catch (error) {}
        }

        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (cart.length === 0) {
                showToast("មិនមានទំនិញក្នុងកន្ត្រកទេ", "error");
                return;
            }

            const cName = document.getElementById('cusName').value.trim();
            const cTele = document.getElementById('cusTelegram').value.trim() || "អតិថិជនមិនបានប្រើប្រាស់ Telegram App";
            const cLoc = document.getElementById('cusLocation').value.trim() || "មិនមានទិន្នន័យ GPS ទេ";

            localStorage.setItem('last_customer_name', cName);
            
            btnCheckout.disabled = true;
            btnCheckout.innerHTML = '<i class="fas fa-spinner fa-spin"></i> កំពុងបញ្ជូន...';

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const orderItems = cart.map(item => ({
                id: item.id,
                name: item.name,
                price: item.price,
                quantity: item.quantity
            }));

            const orderData = {
                userId: 'guest',
                customerName: cName,
                telegram: cTele,
                location: cLoc,
                items: orderItems,
                totalPrice: total,
                total: total,
                status: 'pending',
                timestamp: new Date().toISOString(),
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, ORDERS_PATH), orderData);
                await sendOrderToTelegram(orderData, total);
                
                cart = [];
                checkoutForm.reset();
                updateCartUI();
                toggleCart();
                showToast("ការកុម្ម៉ង់ទទួលបានជោគជ័យ!", "success");

            } catch (error) {
                showToast("បរាជ័យក្នុងការកុម្ម៉ង់ សូមព្យាយាមម្តងទៀត។", "error");
            } finally {
                btnCheckout.innerHTML = 'បញ្ជាក់ការកុម្ម៉ង់ <i class="fas fa-check-circle"></i>';
                btnCheckout.disabled = cart.length === 0;
            }
        });

        function toggleCart() {
            cartModal.classList.toggle('active');
            if (cartModal.classList.contains('active')) {
                // ហៅរកទីតាំងម្តងទៀតពេលបើកកន្ត្រក ដើម្បីប្រាកដថាបាន GPS
                if (!document.getElementById('cusLocation').value || document.getElementById('cusLocation').value.includes('មិនគាំទ្រ')) {
                    fetchAutoLocation();
                }
            }
        }

        cartToggleBtn.addEventListener('click', toggleCart);
        closeCartBtn.addEventListener('click', toggleCart);
        cartModal.addEventListener('click', (e) => { if (e.target === cartModal) toggleCart(); });

        function showToast(message, type = "success") {
            toastMessage.textContent = message;
            toastIcon.className = type === "success" ? "fas fa-check-circle text-green-400 text-lg" : "fas fa-exclamation-circle text-red-400 text-lg";
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 3500);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        init();
    </script>
</body>
</html>
