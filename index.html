<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Grand Café - Menu</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { --primary: #ff4757; --bg-color: #f7f9fa; --text-main: #2f3542; }
        body { font-family: 'Khmer OS Battambang', sans-serif; background-color: var(--bg-color); margin: 0; padding-bottom: 90px; color: var(--text-main); }
        .header { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=800&fit=crop'); background-size: cover; background-position: center; height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .menu-container { padding: 15px; max-width: 600px; margin: auto; }
        .menu-item { background: white; border-radius: 15px; padding: 12px; margin-bottom: 15px; display: flex; box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: relative; }
        .menu-img { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; }
        .menu-info { padding-left: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .menu-title { margin: 0; font-size: 16px; }
        .menu-price { margin: 5px 0 0 0; font-size: 15px; font-weight: bold; color: var(--primary); }
        .add-btn { position: absolute; bottom: 12px; right: 12px; background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(255,71,87,0.4); display: flex; justify-content: center; align-items: center;}
        
        .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: #2f3542; color: white; padding: 15px 20px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; z-index: 100; transition: 0.3s; }
        .cart-qty { background: var(--primary); padding: 2px 8px; border-radius: 15px; font-weight: bold; margin-right: 10px; }
        
        .cart-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; }
        .cart-modal.show { opacity: 1; pointer-events: all; }
        .cart-content { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; transform: translateY(100%); transition: 0.3s; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .cart-list-ui { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .cart-list-ui li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .modal-total { text-align: right; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        
        .user-auto-info { background: #eef2f5; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; color: #2c3e50; border-left: 4px solid var(--primary); }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>☕ The Grand Café</h1>
        <p>ម៉ឺនុយឌីជីថល</p>
    </div>

    <div class="menu-container" id="menu-list">
        <p style="text-align:center; color:#888;">កំពុងទាញយកម៉ឺនុយ...</p>
    </div>

    <div id="floating-cart" class="floating-cart hidden" onclick="openCartModal()">
        <div><span class="cart-qty" id="cart-count">0</span><span>មើលកន្ត្រក</span></div>
        <div style="font-weight: bold;">$<span id="cart-total-price">0.00</span></div>
    </div>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="modal-header">
                <h2 style="margin:0; color:#ff4757;">🛒 កន្ត្រករបស់អ្នក</h2>
                <button style="background:none; border:none; font-size:24px; cursor:pointer;" onclick="closeCartModal()">&times;</button>
            </div>
            <ul class="cart-list-ui" id="modal-cart-list"></ul>
            <div class="modal-total">សរុប: $<span id="modal-total-price">0.00</span></div>
            
            <div id="auto-user-box" class="user-auto-info hidden">
                ✅ <b>អត្តសញ្ញាណ:</b> <span id="tg-name"></span> <br>
                💬 <b>គណនី:</b> <span id="tg-username"></span>
            </div>

            <div id="manual-input-box">
                <input type="text" id="cust-name" class="input-box" placeholder="បញ្ជូលឈ្មោះរបស់អ្នក">
                <input type="text" id="cust-contact" class="input-box" placeholder="លេខទូរស័ព្ទ">
            </div>
            
            <button id="submit-btn" class="submit-btn" onclick="submitOrder()">🚀 បញ្ជូនការកម្មង់ (Auto GPS)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ១. ដាក់ Firebase Config របស់អ្នកនៅទីនេះ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // ២. ដាក់ TELEGRAM BOT INFORMATION របស់អ្នកនៅទីនេះ
        const BOT_TOKEN = "YOUR_BOT_TOKEN"; 
        const CHAT_ID = "YOUR_CHAT_ID"; 

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const menuRef = collection(db, "menu_items");

        // Telegram Auto User
        const tg = window.Telegram.WebApp;
        tg.expand();
        let autoName = "", autoUsername = "";
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let user = tg.initDataUnsafe.user;
            autoName = user.first_name + (user.last_name ? " " + user.last_name : "");
            autoUsername = user.username ? "@" + user.username : "ID: " + user.id;
            document.getElementById('auto-user-box').classList.remove('hidden');
            document.getElementById('manual-input-box').classList.add('hidden');
            document.getElementById('tg-name').innerText = autoName;
            document.getElementById('tg-username').innerText = autoUsername;
        }

        window.cart = [];
        window.cartTotal = 0;

        // ទាញយកទិន្នន័យពី Firebase
        onSnapshot(menuRef, (snapshot) => {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';
            snapshot.forEach((doc) => {
                let item = doc.data();
                menuList.innerHTML += `
                    <div class="menu-item">
                        <img src="${item.image || 'https://via.placeholder.com/90'}" class="menu-img">
                        <div class="menu-info">
                            <h3 class="menu-title">${item.name}</h3>
                            <p class="menu-price">$${item.price.toFixed(2)}</p>
                        </div>
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>
                    </div>
                `;
            });
        });

        window.addToCart = function(name, price) {
            window.cart.push({ name, price });
            window.cartTotal += price;
            document.getElementById('cart-count').innerText = window.cart.length;
            document.getElementById('cart-total-price').innerText = window.cartTotal.toFixed(2);
            document.getElementById('floating-cart').classList.remove('hidden');
        };

        window.openCartModal = function() {
            const modalList = document.getElementById('modal-cart-list');
            modalList.innerHTML = '';
            window.cart.forEach(item => { modalList.innerHTML += `<li><span>${item.name}</span><span>$${item.price.toFixed(2)}</span></li>`; });
            document.getElementById('modal-total-price').innerText = window.cartTotal.toFixed(2);
            document.getElementById('cart-modal').classList.add('show');
        };

        window.closeCartModal = function() { document.getElementById('cart-modal').classList.remove('show'); };

        window.submitOrder = function() {
            let finalName = autoName || document.getElementById("cust-name").value;
            let finalContact = autoUsername || document.getElementById("cust-contact").value;
            let btn = document.getElementById("submit-btn");

            if (!finalName || !finalContact) { alert("⚠️ សូមបំពេញព័ត៌មាន!"); return; }

            btn.innerText = "⏳ កំពុងចាប់ទីតាំង និងបញ្ជូន...";
            btn.disabled = true;

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => { sendToTelegramAPI(finalName, finalContact, position.coords.latitude, position.coords.longitude, btn); },
                    (error) => { alert("⚠️ សូមអនុញ្ញាតបើកទីតាំង (Location)!"); btn.innerText = "🚀 បញ្ជូនការកម្មង់ (Auto GPS)"; btn.disabled = false; },
                    { enableHighAccuracy: true }
                );
            } else { alert("ទូរស័ព្ទមិនគាំទ្រ GPS ទេ"); btn.disabled = false; }
        };

        async function sendToTelegramAPI(name, contact, lat, lon, btn) {
            let orderDetails = window.cart.map(item => `- ${item.name} ($${item.price.toFixed(2)})`).join('\n');
            let message = `🚀 <b>[APP AUTO] កម្មង់ថ្មីចូល!</b>\n\n👤 <b>អតិថិជន:</b> ${name}\n💬 <b>គណនី:</b> ${contact}\n\n📋 <b>មុខម្ហូប:</b>\n${orderDetails}\n\n💰 <b>សរុប: $${window.cartTotal.toFixed(2)}</b>\n📍 <b>ទីតាំង GPS ខាងក្រោម 👇</b>`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) });
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon }) });
                
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) { tg.close(); } 
                else {
                    alert("✅ ការកម្មង់ជោគជ័យ!");
                    window.cart = []; window.cartTotal = 0; window.closeCartModal();
                    document.getElementById('floating-cart').classList.add('hidden');
                }
            } catch (err) { alert("❌ មានបញ្ហាផ្ញើ សូមសាកល្បងម្ដងទៀត!"); } 
            finally { btn.innerText = "🚀 បញ្ជូនការកម្មង់ (Auto GPS)"; btn.disabled = false; }
        }
    </script>
</body>
</html>
