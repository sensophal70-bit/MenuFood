<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ម្ហូបស្នាដៃខ្មែរ - Order Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .cart-slide { transform: translateX(100%); transition: transform 0.3s ease; }
        .modal-overlay.active .cart-slide { transform: translateX(0); }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        ::-webkit-scrollbar { display: none; }
        .cat-btn { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .cat-btn.active { background-color: #ea580c; color: white; border-color: #ea580c; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header & Logo -->
    <header class="bg-white shadow-sm z-20 flex-shrink-0 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5 text-orange-600">
                <img src="image_2.png" alt="ម្ហូបស្នាដៃខ្មែរ" class="w-10 h-10 rounded-full border-2 border-orange-100 shadow-sm object-cover">
                <span class="text-lg font-bold tracking-tight">ម្ហូបស្នាដៃខ្មែរ</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="historyToggleBtn" class="p-2 text-gray-500 hover:text-orange-600 bg-gray-50 rounded-full h-10 w-10 flex items-center justify-center shadow-sm border border-gray-100"><i class="fas fa-history"></i></button>
                <button id="cartToggleBtn" class="relative p-2 text-gray-600 hover:text-orange-600 bg-gray-50 rounded-full h-10 w-10 flex items-center justify-center shadow-sm border border-gray-100">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto flex flex-col">
        <div class="max-w-7xl mx-auto w-full px-4 pt-4 pb-2 shrink-0 sticky top-0 bg-[#f8fafc] z-10 shadow-sm border-b border-gray-100">
            <div class="relative mb-3">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><i class="fas fa-search"></i></div>
                <input type="text" id="searchInput" placeholder="ស្វែងរកមុខម្ហូប..." class="w-full border border-gray-200 rounded-xl pl-9 p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none shadow-sm bg-white">
            </div>
            <div class="flex overflow-x-auto gap-2 pb-1" id="categoryContainer">
                <button class="cat-btn active whitespace-nowrap px-4 py-1.5 rounded-full font-medium text-xs shadow-sm">ទាំងអស់</button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto w-full px-4 py-4 flex-1">
            <div id="foodGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5">
                <div class="text-center col-span-full py-10 text-gray-400"><i class="fas fa-spinner fa-spin text-3xl mb-2"></i><p>កំពុងទាញយក...</p></div>
            </div>
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex justify-end backdrop-blur-sm">
        <div class="cart-slide bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                <h3 class="font-bold text-gray-800"><i class="fas fa-shopping-bag text-orange-500"></i> កន្ត្រកទំនិញ</h3>
                <button id="closeCartBtn" class="text-gray-400 hover:text-red-500 bg-white rounded-full h-8 w-8 flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>
            <div class="shrink-0 bg-white shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.1)] z-10">
                <form id="checkoutForm" class="p-4 border-b bg-gray-50">
                    <h4 class="font-semibold text-gray-700 text-sm mb-2"><i class="fas fa-id-card text-orange-500"></i> ព័ត៌មានអតិថិជន</h4>
                    <input type="text" id="cusName" required placeholder="ឈ្មោះរបស់អ្នក *" class="w-full border rounded-lg p-2.5 text-sm outline-none shadow-sm">
                    <input type="hidden" id="cusTelegram">
                    <input type="hidden" id="cusLocation">
                </form>
                <div class="p-4">
                    <div class="flex justify-between items-center mb-4"><span class="font-bold">សរុប៖</span><span id="cartTotalPrice" class="text-xl font-bold text-orange-600">$0.00</span></div>
                    <button type="submit" form="checkoutForm" id="btnCheckout" disabled class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl disabled:opacity-50">បញ្ជាក់ការកុម្ម៉ង់</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex justify-end backdrop-blur-sm">
        <div class="cart-slide bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                <h3 class="font-bold text-gray-800"><i class="fas fa-history text-orange-500"></i> ប្រវត្តិការកុម្ម៉ង់</h3>
                <button id="closeHistoryBtn" class="text-gray-400 hover:text-red-500 bg-white rounded-full h-8 w-8 flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="historyItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>
        </div>
    </div>

    <div id="toast" class="toast fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-xl z-[60] flex items-center gap-2 font-medium text-sm w-max"><i class="fas fa-check-circle text-green-400"></i><span id="toastMessage">ជោគជ័យ!</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN_HERE';
        const TELEGRAM_CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID_HERE';
        // ==========================================

        const app = initializeApp({ apiKey: "AIzaSyDWG8buz8xHyFigceq8u-qVX429344MlSs", projectId: "my-restaurant-app-5dd76" });
        const db = getFirestore(app);

        let foodsList = [], categoriesList = [], cart = [], myOrdersHistory = [];
        let currentCategory = 'all', searchQuery = '';
        let deviceId = localStorage.getItem('app_device_id');
        if (!deviceId) { deviceId = 'dev_' + Math.random().toString(36).substr(2, 10) + Date.now(); localStorage.setItem('app_device_id', deviceId); }

        function init() { fetchCategories(); fetchFoods(); autoDetectTelegram(); fetchAutoLocation(); fetchMyOrderHistory(); }

        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderFoods(); });

        function autoDetectTelegram() {
            if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                document.getElementById('cusName').value = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
                document.getElementById('cusTelegram').value = tgUser.username ? `https://t.me/${tgUser.username}` : `tg://user?id=${tgUser.id}`;
            } else if (localStorage.getItem('last_customer_name')) {
                document.getElementById('cusName').value = localStorage.getItem('last_customer_name');
            }
        }

        function fetchAutoLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('cusLocation').value = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                }, () => { document.getElementById('cusLocation').value = "គ្មានទីតាំង"; }, { enableHighAccuracy: true });
            }
        }

        function fetchCategories() {
            onSnapshot(collection(db, 'categories'), snap => {
                categoriesList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                let html = `<button onclick="window.filterCategory('all')" class="cat-btn ${currentCategory === 'all' ? 'active' : ''} px-4 py-1.5 rounded-full text-xs shadow-sm">ទាំងអស់</button>`;
                categoriesList.forEach(cat => { html += `<button onclick="window.filterCategory('${cat.id}')" class="cat-btn ${currentCategory === cat.id ? 'active' : ''} px-4 py-1.5 rounded-full text-xs shadow-sm">${escapeHTML(cat.name)}</button>`; });
                document.getElementById('categoryContainer').innerHTML = html;
            });
        }

        window.filterCategory = (catId) => { currentCategory = catId; fetchCategories(); renderFoods(); };

        function fetchFoods() {
            onSnapshot(collection(db, 'foods'), snap => {
                foodsList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderFoods();
            });
        }

        function renderFoods() {
            let f = foodsList;
            if (currentCategory !== 'all') f = f.filter(x => x.categoryId === currentCategory);
            if (searchQuery.trim() !== '') f = f.filter(x => (x.name || '').toLowerCase().includes(searchQuery));

            if (f.length === 0) return document.getElementById('foodGrid').innerHTML = `<div class="col-span-full py-10 text-center text-gray-400">រកមិនឃើញ</div>`;
            document.getElementById('foodGrid').innerHTML = f.map(food => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col">
                    <img src="${food.imageUrl || food.image}" class="w-full h-28 object-cover rounded-t-xl bg-gray-50">
                    <div class="p-2.5 flex-1 flex flex-col">
                        <h3 class="text-sm font-bold leading-tight mb-1">${escapeHTML(food.name)}</h3>
                        <div class="flex justify-between items-center mt-auto pt-2 border-t border-gray-50">
                            <span class="text-orange-600 font-bold">$${parseFloat(food.price||0).toFixed(2)}</span>
                            <button onclick="window.addToCart('${food.id}')" class="py-1 px-2 bg-orange-50 text-orange-600 rounded-lg text-xs font-bold"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.addToCart = (id) => {
            const food = foodsList.find(f => f.id === id); if (!food) return;
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity++; else cart.push({ ...food, quantity: 1 });
            updateCartUI(); showToast("បានបន្ថែម", "success");
        };

        window.updateQuantity = (id, delta) => {
            const item = cart.find(i => i.id === id); if (!item) return;
            item.quantity += delta; if (item.quantity <= 0) cart = cart.filter(i => i.id !== id); updateCartUI();
        };

        window.removeFromCart = (id) => { cart = cart.filter(i => i.id !== id); updateCartUI(); };

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartBadge');
            if (totalItems > 0) { badge.textContent = totalItems; badge.classList.remove('hidden'); } else badge.classList.add('hidden');

            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 mt-10">មិនមានទំនិញទេ</div>`;
                document.getElementById('cartTotalPrice').textContent = '$0.00'; document.getElementById('btnCheckout').disabled = true; return;
            }

            document.getElementById('btnCheckout').disabled = false; let totalCost = 0;
            container.innerHTML = cart.map(item => {
                totalCost += item.price * item.quantity;
                return `
                    <div class="flex gap-2 p-2.5 bg-white border border-gray-200 rounded-xl items-center">
                        <img src="${item.imageUrl || item.image}" class="w-12 h-12 rounded object-cover">
                        <div class="flex-1 pr-2">
                            <h4 class="font-bold text-xs">${escapeHTML(item.name)}</h4>
                            <div class="text-[11px] text-gray-500">$${parseFloat(item.price).toFixed(2)} x ${item.quantity} = <b class="text-orange-600">$${(item.price * item.quantity).toFixed(2)}</b></div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <button onclick="window.removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash-alt text-xs"></i></button>
                            <div class="flex items-center gap-1 bg-gray-50 border rounded p-0.5">
                                <button onclick="window.updateQuantity('${item.id}', -1)" class="w-5 h-5 bg-white rounded shadow-sm text-gray-600">-</button>
                                <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="window.updateQuantity('${item.id}', 1)" class="w-5 h-5 bg-white rounded shadow-sm text-gray-600">+</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('cartTotalPrice').textContent = `$${totalCost.toFixed(2)}`;
        }

        function fetchMyOrderHistory() {
            onSnapshot(query(collection(db, 'orders'), where("deviceId", "==", deviceId)), snap => {
                myOrdersHistory = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                const container = document.getElementById('historyItemsContainer');
                if (myOrdersHistory.length === 0) return container.innerHTML = `<div class="text-center text-gray-400 mt-10">មិនមានប្រវត្តិទេ</div>`;
                
                container.innerHTML = myOrdersHistory.map(o => {
                    const isCompleted = o.status === 'completed' || o.status === 'រួចរាល់ (Completed)';
                    const isDel = o.status === 'delivering';
                    const sCol = isCompleted ? 'bg-green-100 text-green-700' : (isDel ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700');
                    const sTxt = isCompleted ? 'រួចរាល់' : (isDel ? 'កំពុងដឹក' : 'កំពុងរង់ចាំ');
                    const fTotal = parseFloat(o.totalPrice || o.total || 0), dFee = parseFloat(o.deliveryFee || 0);

                    return `
                    <div class="bg-white border rounded-xl shadow-sm p-3">
                        <div class="flex justify-between items-center mb-2"><span class="text-[10px] text-gray-500">${new Date(o.createdAt).toLocaleString('km-KH')}</span><span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${sCol}">${sTxt}</span></div>
                        <div class="bg-gray-50 p-2 rounded mb-2">${(o.items||[]).map(i=>`<div class="flex justify-between text-[10px]"><span>${i.quantity}x ${escapeHTML(i.name)}</span><span>$${(i.price*i.quantity).toFixed(2)}</span></div>`).join('')}</div>
                        ${o.driverName ? `<div class="text-[10px] text-blue-600 bg-blue-50 p-1.5 rounded mb-2 font-bold"><i class="fas fa-motorcycle"></i> អ្នកដឹក៖ ${escapeHTML(o.driverName)} ${o.driverPhone ? `(${o.driverPhone})` : ''}</div>` : ''}
                        <div class="border-t pt-1 text-[11px]"><div class="flex justify-between text-gray-500"><span>តម្លៃម្ហូប:</span><span>$${fTotal.toFixed(2)}</span></div>${dFee>0||isCompleted?`<div class="flex justify-between text-gray-500"><span>សេវាដឹក:</span><span class="text-green-600">+$${dFee.toFixed(2)}</span></div>`:''}
                        <div class="flex justify-between font-bold mt-1"><span>សរុប:</span><span class="text-orange-600">$${(fTotal+dFee).toFixed(2)}</span></div></div>
                    </div>`;
                }).join('');
            });
        }

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault(); if (cart.length === 0) return;
            const cName = document.getElementById('cusName').value.trim(); localStorage.setItem('last_customer_name', cName);
            const total = cart.reduce((s,i) => s + (i.price * i.quantity), 0);
            const btn = document.getElementById('btnCheckout'); btn.disabled = true;
            
            const orderData = { userId: 'guest', deviceId, customerName: cName, telegram: document.getElementById('cusTelegram').value.trim()||"គ្មាន", location: document.getElementById('cusLocation').value.trim()||"គ្មាន", items: cart.map(i=>({id:i.id, name:i.name, price:i.price, quantity:i.quantity})), totalPrice: total, status: 'pending', createdAt: new Date().toISOString() };
            try {
                await addDoc(collection(db, 'orders'), orderData);
                if (TELEGRAM_BOT_TOKEN !== 'YOUR_TELEGRAM_BOT_TOKEN_HERE') {
                    let msg = `🔔 <b>មានការកុម្ម៉ង់ថ្មី!</b>\n👤 អតិថិជន: ${cName}\n------------------------\n${cart.map(i=>`- ${i.name} (x${i.quantity}) = $${(i.price*i.quantity).toFixed(2)}`).join('\n')}\n------------------------\n💰 <b>សរុប: $${total.toFixed(2)}</b>`;
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'HTML'}) });
                }
                cart = []; document.getElementById('checkoutForm').reset(); updateCartUI(); toggleModal('cartModal'); setTimeout(()=>toggleModal('historyModal'), 500); showToast("ជោគជ័យ!", "success");
            } catch (err) { showToast("បរាជ័យ", "error"); } finally { btn.disabled = false; }
        });

        function toggleModal(id) { const m = document.getElementById(id); document.getElementById(id==='cartModal'?'historyModal':'cartModal').classList.remove('active'); m.classList.toggle('active'); if(id==='cartModal'&&m.classList.contains('active')) fetchAutoLocation(); }
        document.getElementById('cartToggleBtn').onclick=()=>toggleModal('cartModal'); document.getElementById('historyToggleBtn').onclick=()=>toggleModal('historyModal');
        document.getElementById('closeCartBtn').onclick=()=>toggleModal('cartModal'); document.getElementById('closeHistoryBtn').onclick=()=>toggleModal('historyModal');
        function showToast(m, t="success") { document.getElementById('toastMessage').textContent=m; document.getElementById('toast').classList.add('show'); setTimeout(()=>document.getElementById('toast').classList.remove('show'), 3000); }
        function escapeHTML(str) { return str?String(str).replace(/[&<>'"]/g, t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)):''; }
        init();
    </script>
</body>
</html>
